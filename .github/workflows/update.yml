name: Обновление дашборда

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Тянем данные из Яндекса
        env:
          YANDEX_TOKEN: $ secrets.YANDEX_TOKEN 
          SITE: igear-shop.ru
          METRIKA_COUNTER: $ secrets.METRIKA_COUNTER 
        run: python fetch.py

      - name: Сохраняем свежий data.json
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@github.com"
          git add data.json
          git commit -m "Обновление данных $(date +%F)" || echo "Без изменений"
          git push
